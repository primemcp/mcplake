basePath: /admin
definitions:
  controlplane.AuthInfo:
    properties:
      auth_required:
        description: |-
          AuthRequired mirrors whether the admin-auth gate is installed. When
          false the UI skips the login flow entirely and behaves as it did
          before ADR-0010.
        type: boolean
      authorization_endpoint:
        description: AuthorizationEndpoint is where the UI redirects the browser.
        type: string
      client_id:
        description: ClientID is the public client registered for the UI.
        type: string
      issuer:
        description: |-
          Issuer is oidc.issuer, shown to the operator so they can see which
          provider they are about to be sent to.
        type: string
      scopes:
        description: Scopes is what to request. Empty when login isn't configured.
        items:
          type: string
        type: array
      token_endpoint:
        description: TokenEndpoint is where the UI exchanges the code for a token.
        type: string
    type: object
  controlplane.accessPolicyDTO:
    properties:
      enabled:
        type: boolean
      grants:
        items:
          $ref: '#/definitions/controlplane.grantDTO'
        type: array
      match:
        items:
          $ref: '#/definitions/controlplane.claimRuleDTO'
        type: array
      name:
        type: string
    type: object
  controlplane.accessPolicyRequest:
    properties:
      enabled:
        description: Enabled is optional; omitting it means enabled (see enabledOrTrue).
        type: boolean
      grants:
        items:
          $ref: '#/definitions/controlplane.grantDTO'
        type: array
      match:
        items:
          $ref: '#/definitions/controlplane.claimRuleDTO'
        type: array
      name:
        type: string
    type: object
  controlplane.claimRuleDTO:
    properties:
      path:
        type: string
      pattern:
        type: string
    required:
    - path
    - pattern
    type: object
  controlplane.connectConfigDTO:
    properties:
      arguments:
        items:
          type: string
        type: array
      command:
        type: string
      url:
        type: string
    type: object
  controlplane.errorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  controlplane.filterPolicyDTO:
    properties:
      drop_fields:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      match:
        items:
          $ref: '#/definitions/controlplane.claimRuleDTO'
        type: array
      mcp:
        type: string
      name:
        type: string
      tool:
        type: string
    type: object
  controlplane.filterPolicyRequest:
    properties:
      drop_fields:
        items:
          type: string
        type: array
      enabled:
        description: Enabled is optional; omitting it means enabled (see enabledOrTrue).
        type: boolean
      match:
        items:
          $ref: '#/definitions/controlplane.claimRuleDTO'
        type: array
      mcp:
        type: string
      name:
        type: string
      tool:
        type: string
    required:
    - mcp
    - tool
    type: object
  controlplane.grantDTO:
    properties:
      mcp:
        type: string
      tools:
        items:
          type: string
        type: array
    required:
    - mcp
    type: object
  controlplane.mcpRegistrationDTO:
    properties:
      connect:
        $ref: '#/definitions/controlplane.connectConfigDTO'
      enabled:
        type: boolean
      name:
        type: string
      status:
        type: string
      tools:
        additionalProperties:
          $ref: '#/definitions/controlplane.toolSchemaDTO'
        type: object
      transport:
        type: string
    type: object
  controlplane.registerMCPRequest:
    properties:
      connect:
        $ref: '#/definitions/controlplane.connectConfigDTO'
      enabled:
        description: Enabled is optional; omitting it means enabled (see enabledOrTrue).
        type: boolean
      name:
        type: string
      transport:
        type: string
    required:
    - name
    type: object
  controlplane.setEnabledRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  controlplane.toolSchemaDTO:
    properties:
      input_schema:
        type: object
      name:
        type: string
      output_schema:
        type: object
    type: object
info:
  contact: {}
  description: Admin API for registering downstream MCPs and managing access/filter
    policies. See ADR-0005 and ADR-0007.
  title: MCP Gateway Control-Plane Admin API
  version: "1.0"
paths:
  /access-policies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controlplane.accessPolicyDTO'
            type: array
      summary: List access policies
      tags:
      - access-policies
    post:
      consumes:
      - application/json
      parameters:
      - description: Access policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.accessPolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controlplane.accessPolicyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Create an access policy
      tags:
      - access-policies
  /access-policies/{name}:
    delete:
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Delete an access policy
      tags:
      - access-policies
    get:
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.accessPolicyDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Get an access policy
      tags:
      - access-policies
    put:
      consumes:
      - application/json
      description: Creates it if absent.
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      - description: Access policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.accessPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.accessPolicyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Replace an access policy
      tags:
      - access-policies
  /auth/config:
    get:
      description: 'How the embedded admin web UI should authenticate: whether admin
        auth is enforced and, if so, the OIDC Authorization Code + PKCE coordinates
        to use. Unauthenticated — a browser with no token yet has to be able to read
        it (ADR-0014). Discloses only the public half of a PKCE client (client_id,
        provider endpoints, scopes); there is no client secret.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.AuthInfo'
      summary: Admin UI login configuration
      tags:
      - auth
  /filter-policies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controlplane.filterPolicyDTO'
            type: array
      summary: List filter policies
      tags:
      - filter-policies
    post:
      consumes:
      - application/json
      parameters:
      - description: Filter policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.filterPolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controlplane.filterPolicyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Create a filter policy
      tags:
      - filter-policies
  /filter-policies/{name}:
    delete:
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Delete a filter policy
      tags:
      - filter-policies
    get:
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.filterPolicyDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Get a filter policy
      tags:
      - filter-policies
    put:
      consumes:
      - application/json
      description: Creates it if absent.
      parameters:
      - description: Policy name
        in: path
        name: name
        required: true
        type: string
      - description: Filter policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.filterPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.filterPolicyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Replace a filter policy
      tags:
      - filter-policies
  /healthz:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Control-plane health check
      tags:
      - health
  /mcps:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controlplane.mcpRegistrationDTO'
            type: array
      summary: List registered MCPs
      tags:
      - mcps
    post:
      consumes:
      - application/json
      description: Connects to the MCP, discovers its tools, and makes it immediately
        callable via the data plane. Persisted only on success.
      parameters:
      - description: MCP registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.registerMCPRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controlplane.mcpRegistrationDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Register an MCP
      tags:
      - mcps
  /mcps/{name}:
    delete:
      parameters:
      - description: MCP name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Unregister an MCP
      tags:
      - mcps
    patch:
      consumes:
      - application/json
      description: Toggles the registration's `enabled` flag in place without reconnecting.
        A disabled MCP rejects every data-plane call with 403 mcp_disabled.
      parameters:
      - description: MCP name
        in: path
        name: name
        required: true
        type: string
      - description: Desired state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controlplane.setEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controlplane.mcpRegistrationDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controlplane.errorResponse'
      summary: Enable or disable an MCP
      tags:
      - mcps
swagger: "2.0"
