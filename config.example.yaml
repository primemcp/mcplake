# MCP Gateway Configuration Example

server:
  data_plane_addr: ":8080"    # fasthttp tool-call proxy (ADR-0001)
  control_plane_addr: ":8081" # Gin admin API (ADR-0005)

oidc:
  jwks_url: "https://auth.example.com/.well-known/jwks.json"
  issuer: "https://auth.example.com"
  audience: "mcp-gateway"
  # jwks_cache_ttl: 1h

mcps:
  - name: postgres-ro
    type: stdio
    command: mcp-server-postgres
    arguments:
      - "--connection-string"
      - "postgresql://reader@localhost/mydb"
      - "--read-only"

  - name: postgres-rw
    type: stdio
    command: mcp-server-postgres
    arguments:
      - "--connection-string"
      - "postgresql://writer@localhost/mydb"

  - name: filesystem
    type: stdio
    command: mcp-server-filesystem
    arguments:
      - "/data"

# Route requests based on JWT claims
routing:
  - claim_key: role
    claim_value: "db-reader"
    mcp_instance: postgres-ro
    priority: 10

  - claim_key: role
    claim_value: "db-writer"
    mcp_instance: postgres-rw
    priority: 10

  - claim_key: role
    claim_value: "admin"
    mcp_instance: postgres-rw
    priority: 5

# Filter response fields based on JWT claims
filtering:
  - claim_key: role
    claim_value: "user"
    mcp_name: postgres-ro
    tool_name: get_user
    hide_fields:
      - hashed_password
      - api_key
      - internal_id

  - claim_key: role
    claim_value: "user"
    mcp_name: postgres-ro
    tool_name: list_users
    hide_fields:
      - email
      - hashed_password
      - phone_number
