# MCP Gateway Configuration Example

server:
  data_plane_addr: ":8080"    # fasthttp tool-call proxy (ADR-0001)
  control_plane_addr: ":8081" # Gin admin API (ADR-0005)

oidc:
  jwks_url: "https://auth.example.com/.well-known/jwks.json"
  issuer: "https://auth.example.com"
  audience: "mcp-gateway"
  # jwks_cache_ttl: 1h

# Authentication for the control-plane admin API (/admin/*). ADR-0010.
# Callers present a Bearer JWT verified against the oidc: JWKS above; their
# claims must then satisfy every match rule (ANDed, ADR-0002 syntax).
# Omitting this section leaves /admin/* OPEN (with a startup warning) for
# backward compatibility — bind control_plane_addr to a trusted interface
# until you set match rules. `enabled: false` also forces it off.
# admin_auth:
#   match:
#     - path: "$.role"
#       pattern: "^admin$"

# Control-plane persistence (ADR-0006). Defaults to embedded SQLite — no
# external service required for a single-instance, air-gapped deployment.
persistence:
  driver: sqlite       # sqlite (default) | postgres
  dsn: "gateway.db"     # SQLite file path, or a Postgres connection string

mcps:
  - name: postgres-ro
    type: stdio
    command: mcp-server-postgres
    arguments:
      - "--connection-string"
      - "postgresql://reader@localhost/mydb"
      - "--read-only"

  - name: postgres-rw
    type: stdio
    command: mcp-server-postgres
    arguments:
      - "--connection-string"
      - "postgresql://writer@localhost/mydb"

  - name: filesystem
    type: stdio
    command: mcp-server-filesystem
    arguments:
      - "/data"
    # enabled: false   # optional, default true. A disabled MCP still
    #                   # connects and caches its tools, but the data plane
    #                   # rejects every call for it with 403 mcp_disabled.
    #                   # Toggle at runtime with PATCH /admin/mcps/:name.

# Grant access to (mcp, tool) pairs based on JWT claims. A call is
# authorized if ANY policy's match matches the claims AND has a grant
# covering the requested (mcp, tool). "*" means "all" for either field.
# See ADR-0002 (match rule syntax) and ADR-0004 (policy semantics).
access_policies:
  - name: db-reader
    match:
      - path: "$.role"
        pattern: "^db-reader$"
    grants:
      - mcp: postgres-ro
        tools: ["*"]

  - name: db-writer
    match:
      - path: "$.role"
        pattern: "^db-writer$"
    grants:
      - mcp: postgres-rw
        tools: ["*"]

  - name: admin
    match:
      - path: "$.role"
        pattern: "^admin$"
    grants:
      - mcp: "*"
        tools: ["*"]
    # enabled: false   # optional, default true. A disabled access policy is
    #                   # skipped: it grants nothing, so a caller authorized
    #                   # only by it gets 403 forbidden.

# Strip response fields for a specific (mcp, tool) call when the caller's
# claims match. Unlike access_policies' grants, mcp/tool here are exact,
# not wildcarded — a filter always targets one specific tool response shape.
filter_policies:
  - name: hide-pii-for-plain-users-get-user
    match:
      - path: "$.role"
        pattern: "^user$"
    mcp: postgres-ro
    tool: get_user
    drop_fields:
      - "$.hashed_password"
      - "$.api_key"
      - "$.internal_id"
    # enabled: false   # optional, default true. A disabled filter policy
    #                   # strips nothing, so the response is returned
    #                   # unfiltered by it (other enabled filters still run).

  - name: hide-pii-for-plain-users-list-users
    match:
      - path: "$.role"
        pattern: "^user$"
    mcp: postgres-ro
    tool: list_users
    drop_fields:
      - "$.email"
      - "$.hashed_password"
      - "$.phone_number"
